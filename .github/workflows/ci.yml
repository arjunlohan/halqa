name: check
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Type check, lint bans, the kernel proof, every test suite.
      - run: pnpm check
      # Break each safety property on purpose and confirm a check notices.
      - run: pnpm mutations
